<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d3e"/>
      <stop offset="1" stop-color="#15161e"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2130"/>
      <stop offset="1" stop-color="#101118"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>
  <!-- body (Apple icon grid: 824px on a 1024px canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#body)">
    <!-- vertical tab sidebar -->
    <rect x="100" y="100" width="290" height="824" fill="url(#side)"/>
    <rect x="388" y="100" width="4" height="824" fill="#3b3f57"/>
    <rect x="160" y="196" width="172" height="64" rx="20" fill="#7aa2f7"/>
    <rect x="160" y="296" width="172" height="64" rx="20" fill="#3b3f57"/>
    <rect x="160" y="396" width="172" height="64" rx="20" fill="#3b3f57"/>
    <rect x="160" y="496" width="120" height="64" rx="20" fill="#3b3f57"/>
  </g>
  <!-- prompt -->
  <path d="M480 420 L600 512 L480 604" fill="none" stroke="#9ece6a" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="650" y="572" width="170" height="52" rx="14" fill="#c0caf5"/>
  <!-- subtle rim -->
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
</svg>
